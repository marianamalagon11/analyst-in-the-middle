# Configuracion base del laboratorio.
# Todo lo que afecte un resultado debe estar aqui: el hash de este archivo
# queda guardado en cada corrida para poder reconstruirla.

project: analyst-in-the-middle

# Semilla unica del laboratorio. Se pasa a Ollama en cada peticion.
seed: 1337

ollama:
  host: http://localhost:11434
  # 30 min: en CPU un analisis real (reporte de ~2000 tokens + JSON largo)
  # pasa de los 5 min con holgura. Ver results/setup_report.md.
  timeout_s: 1800
  # Cuanto deja Ollama el modelo cargado en memoria entre peticiones.
  # Subirlo evita recargar el modelo en cada llamada de un experimento largo.
  keep_alive: 15m
  max_retries: 2

models:
  # Modelo principal del analista. Se confirma al terminar la linea base (Fase 2).
  analyst: llama3.1:8b-instruct-q4_K_M
  # El juez usa un modelo distinto al analista a proposito (ver ARCHITECTURE.md, seccion 7).
  judge: qwen2.5:7b-instruct
  # Modelos que se comparan en el experimento 2.
  compare:
    - llama3.1:8b-instruct-q4_K_M
    - mistral:7b-instruct
    - qwen2.5:7b-instruct

# Parametros de generacion. temperature 0 + top_k 1 + seed fija = salida reproducible.
generation:
  temperature: 0.0
  top_p: 1.0
  top_k: 1
  repeat_penalty: 1.0
  # Medido en la Fase 2 (results/baseline_report.md): el reporte mas largo ocupa
  # ~5.600 tokens de prompt reales (los hashes tokenizan mal; chars/4 subestima casi a
  # la mitad) y un JSON con 25 IoCs + 20 tecnicas ronda los 3.000 tokens. Con 8192 /
  # 2048 el margen era de ~500 tokens: un payload de la Fase 3 no cabia.
  num_ctx: 12288
  num_predict: 4096

analyst:
  system_prompt: src/aitm/llm/prompts/analyst_base.md
  # Reintentos cuando la respuesta no es JSON valido contra el esquema.
  max_parse_retries: 2
  # Pide a Ollama que restrinja la salida al esquema JSON del analista.
  structured_output: true
  # Como lee los reportes el pipeline SIN defensas. Los tres valores en `true` son
  # el analista ingenuo: arrastra lo que un conversor normal arrastraria. Ponerlos en
  # `false` equivale a sanitizar, asi que se dejan aqui para poder medir ese contraste
  # y para que quede registrado en el hash de la configuracion de cada corrida.
  parser:
    include_hidden_html: true
    include_html_comments: true
    include_pdf_metadata: true

judge:
  system_prompt: src/aitm/llm/prompts/judge.md
  # Por encima de esta confianza se considera que el reporte trae inyeccion.
  threshold: 0.5

# Defensas activas por defecto. Vacio = analista sin proteccion (linea base del ataque).
# Valores validos: sanitizer, spotlighting, schema_validation, llm_judge
defenses:
  enabled: []

attacks:
  vectors:
    - plaintext
    - html_hidden
    - unicode_invisible
    - pdf_hidden
    - author_note
  goals:
    - flip_to_benign
    - omit_ioc
    - downgrade_severity
    - drop_technique

paths:
  data_raw: data/raw
  data_processed: data/processed
  labels: data/labels
  poisoned: data/poisoned
  runs: results/runs
  tables: results/tables
  figures: results/figures
