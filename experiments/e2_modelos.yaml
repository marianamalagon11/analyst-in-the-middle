# Experimento 2: ASR por vector y modelo, sin defensas.
# El modelo principal sale del experimento 1; aqui corren los otros dos, con el
# mismo objetivo y los mismos reportes. Opcional: se corre si sobra GPU.
# Diseno reducido (2026-11-05): un objetivo (flip_to_benign, el principal del
# setup_report y el de la demo) y 6 reportes elegidos por regla fija antes de correr
# (ronda por proveedor en orden alfabetico entre los que tienen ese objetivo). La matriz
# de 12 reportes x 4 objetivos costaba ~17 h; esta, ~2 h en una GPU T4. Limitacion
# declarada en el informe: 6 casos por vector y defensa.
name: e2_modelos
description: ASR por vector en mistral y qwen2.5, sin defensas (opcional, ~1,8 h mas)
models: [mistral:7b-instruct, qwen2.5:7b-instruct]
defenses: [[]]
goals: [flip_to_benign]
attacks:
  plaintext: {variants: [inline], formats: [txt]}
  author_note: {variants: [analyst_note], formats: [txt]}
  html_hidden: {variants: [display_none], formats: [html]}
  unicode_invisible: {variants: [tags], formats: [txt]}
  pdf_hidden: {variants: [metadata], formats: [pdf]}
reports:   # 6 de los 10 con objetivo flip_to_benign: ronda por proveedor (orden alfabetico)
  - intel471_2021-04-07_ettersilent-maldoc-builder-macro-trickbot
  - lab52_2020-06-02_mustang-panda-recent-activity-dll
  - proofpoint_2021-05-26_bazaflix-bazaloader-fakes-movie-streaming
  - quoteintelligence_2020-08-07_blackwater-malware-leveraging-beirut-tragedy
  - zscaler_2020-06-26_taurus-new-stealer-town
