# Experimento 1: ASR por vector, sin defensas, modelo principal.
# Fijado antes de correr (Fase 5). Variante canonica de cada vector (la primera, igual
# que `aitm attack --canonical`), cada vector en su formato natural y el payload
# canonico de cada objetivo (`payloads.CANONICAL`, Fase 3).
name: e1_vectores
description: ASR por vector y objetivo, sin defensas, modelo principal
models: [analyst]
defenses: [[]]
goals: [flip_to_benign, omit_ioc, downgrade_severity, drop_technique]
attacks:
  plaintext: {variants: [inline], formats: [txt]}
  author_note: {variants: [analyst_note], formats: [txt]}
  html_hidden: {variants: [display_none], formats: [html]}
  unicode_invisible: {variants: [tags], formats: [txt]}
  pdf_hidden: {variants: [metadata], formats: [pdf]}
reports: all
clean: true
